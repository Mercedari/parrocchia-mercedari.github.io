<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santa Maria della Mercede a Montecalvario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style id="css">:root{
  --bg:#E8E9EC; --surface:#F7F7F8; --ink:#1A1D24; --muted:#5A5F6B;
  --lapis:#24336B; --gilt:#A87B2A; --line:#CFD2D8; --on-gilt:#FFFFFF; --danger:#9B2C2C;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141C; --surface:#1A1E29; --ink:#E7E4DB; --muted:#A3A6AF;
    --lapis:#9FB0E8; --gilt:#D4AA55; --line:#2C3242; --on-gilt:#11141C; --danger:#E08585; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141C; --surface:#1A1E29; --ink:#E7E4DB; --muted:#A3A6AF;
  --lapis:#9FB0E8; --gilt:#D4AA55; --line:#2C3242; --on-gilt:#11141C; --danger:#E08585; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"EB Garamond",Garamond,"Times New Roman",serif;font-size:19px;line-height:1.6}
img{max-width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 20px 48px}
header{display:flex;align-items:center;gap:14px;padding:22px 0 14px;border-bottom:1px solid var(--line)}
.logo{width:52px;height:52px;flex:none;border-radius:50%;border:1.5px dashed var(--gilt);display:grid;place-items:center;font-size:12px;color:var(--muted);overflow:hidden}
.logo.has{border:0;border-radius:0;overflow:visible}
.logo img{width:100%;height:100%;object-fit:contain}
header h1{font-size:22px;font-weight:500;margin:0;line-height:1.2}
header p{margin:0;color:var(--muted);font-size:16px}
.langs{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.langs button,.tabs button{font:inherit;font-size:16px;padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.langs button[aria-pressed="true"],.tabs button[aria-pressed="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--surface)}
.list{list-style:none;margin:8px 0 0;padding:0}
.list a{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.list .th{width:64px;height:64px;border-radius:6px;object-fit:cover;flex:none;background:var(--surface)}
.list strong{display:block;font-size:21px;font-weight:500;line-height:1.25}
.list span{color:var(--muted);font-size:16px;font-style:italic}
.back{display:inline-block;margin:16px 0 4px;color:var(--lapis);text-decoration:none;font-size:17px;background:none;border:0;font-family:inherit;cursor:pointer;padding:0}
.work h2{font-size:clamp(28px,7.5vw,40px);font-weight:500;line-height:1.12;margin:8px 0 4px}
.work .meta{color:var(--muted);font-style:italic;margin:0 0 20px}
figure{margin:0 0 24px}
figure img{display:block;width:100%;border-radius:6px}
figcaption{font-size:14px;color:var(--muted);margin-top:4px}
.listen{display:flex;align-items:center;gap:18px;margin:0 0 28px;background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.halo{width:84px;height:84px;border-radius:50%;background:var(--gilt);color:var(--on-gilt);flex:none;display:grid;place-items:center;box-shadow:0 0 0 8px color-mix(in srgb,var(--gilt) 22%,transparent)}
.halo svg{width:30px;height:30px}
.listen b{display:block;font-size:22px;font-weight:500}
.listen small{color:var(--muted);font-size:15px}
.speed{display:flex;align-items:center;gap:8px;margin:-12px 0 28px;font-size:15px;color:var(--muted);flex-wrap:wrap}
.speed button{font:inherit;font-size:15px;padding:4px 14px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--gilt);border-color:var(--gilt);color:var(--on-gilt)}
.speaking .halo{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 16px color-mix(in srgb,var(--gilt) 10%,transparent)}}
@media (prefers-reduced-motion:reduce){.speaking .halo{animation:none}}
.work p.text{margin:0 0 1em}
.nav2{display:flex;justify-content:space-between;margin-top:32px;gap:12px}
.nav2 a{color:var(--lapis);text-decoration:none}
footer{margin-top:40px;color:var(--muted);font-size:15px}
.vid{display:inline-block;color:var(--lapis);text-decoration:none;border:1px solid var(--lapis);border-radius:20px;padding:6px 16px;font-size:17px}
.vids{display:flex;gap:10px;flex-wrap:wrap}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 20px}
.gi{padding:0;border:0;background:none;cursor:zoom-in;aspect-ratio:1;overflow:hidden;border-radius:6px}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.gal-ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:8px 0}
.gal-ed div{position:relative}
.gal-ed img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.gal-ed .ico{position:absolute;top:4px;right:4px;background:var(--surface);width:30px;height:30px}
.ytc{margin-top:32px}
.givelink{margin-top:36px;text-align:center;font-size:16px}
.givelink a{color:var(--muted);text-decoration:none}
.give{margin-top:40px;padding:22px 20px;border-top:2px solid var(--gilt);background:var(--surface);border-radius:0 0 8px 8px}
.give.full{margin-top:16px}
.give h3{font-size:24px;font-weight:500;margin:0 0 10px;line-height:1.2}
.give p{margin:0 0 12px}
.give .btn{display:inline-block;text-decoration:none;background:var(--gilt);border-color:var(--gilt);color:var(--on-gilt)}
.give .bank{font-size:16px;margin:4px 0 14px;line-height:1.6}
.give .iban{font-variant-numeric:tabular-nums;word-break:break-all}
.give .cp{font:inherit;font-size:14px;padding:2px 10px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.give .thanks{font-style:italic;color:var(--muted);margin:0}
.ver{margin:10px 0 0;font-size:13px;opacity:.75}
footer button{font:inherit;color:var(--lapis);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gilt);outline-offset:3px}
/* editor */
.ed h2{font-size:28px;font-weight:500;margin:12px 0 4px}
.ed h3{font-size:20px;font-weight:600;color:var(--lapis);margin:28px 0 6px;border-top:1px solid var(--line);padding-top:14px}
.ed label{display:block;font-size:15px;color:var(--muted);margin:12px 0 3px}
.ed input[type=text],.ed input[type=url],.ed textarea{width:100%;font:inherit;font-size:17px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.ed textarea{min-height:200px;resize:vertical;line-height:1.5}
.ed .hint{font-size:15px;color:var(--muted);margin:4px 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .st{flex:1;font-size:15px;color:var(--muted);min-width:140px}
.btn{font:inherit;font-size:16px;padding:7px 16px;border-radius:20px;border:1px solid var(--lapis);background:var(--lapis);color:var(--surface);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--lapis)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.elist{list-style:none;padding:0;margin:0}
.elist li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.elist .nm{flex:1;min-width:0}
.elist .nm b{display:block;font-weight:500;line-height:1.2}
.elist .nm small{color:var(--muted)}
.ico{font:inherit;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;flex:none}
.ico:disabled{opacity:.3;cursor:default}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 4px;scrollbar-width:none}
.tabs .miss{border-style:dashed;color:var(--muted)}
.pv{max-height:220px;border-radius:6px;display:block;margin-top:8px}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:16px}
.qrcard{background:#fff;color:#1A1D24;border:1px solid #ccc;border-radius:8px;padding:16px;text-align:center;break-inside:avoid}
.qrcard .q{display:flex;justify-content:center;margin:8px 0}
.qrcard strong{display:block;font-weight:500;line-height:1.2}
.qrcard small{color:#555}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media print{
  header,.langs,footer,.bar,.noprint{display:none!important}
  body{background:#fff}
}
</style>
</head>

ochi anni dopo i francescani tornarono e restaurarono la chiesa. L'interno ha una navata unica con cappelle laterali e una cupola. Il percorso inizia dalla prima cappella a sinistra.","en":"The church was founded in 1560 by the Neapolitan noblewoman Ilaria D'Apuzzo, who gave it to the Franciscan friars, and it was consecrated in 1574. In the 17th century it was enlarged and decorated in the Baroque style.\nIn 1808, under French rule, the friary became a barracks and the square a market. A few years later the Franciscans returned and restored the church. The interior has a single nave with side chapels and a dome. The tour begins at the first chapel on the left.","fr":"L'église fut fondée en 1560 par la noble napolitaine Ilaria D'Apuzzo, qui la donna aux frères franciscains, et fut consacrée en 1574. Au XVIIe siècle, elle fut agrandie et décorée dans le style baroque.\nEn 1808, sous la domination française, le couvent devint une caserne et la place un marché. Quelques années plus tard, les franciscains revinrent et restaurèrent l'église. L'intérieur comporte une nef unique avec des chapelles latérales et une coupole. La visite commence par la première chapelle à gauche.","de":"Die Kirche wurde 1560 von der neapolitanischen Adligen Ilaria D'Apuzzo gestiftet, die sie den Franziskanern schenkte, und 1574 geweiht. Im 17. Jahrhundert wurde sie erweitert und im Barockstil ausgeschmückt.\n1808, während der französischen Herrschaft, wurde das Kloster zur Kaserne und der Platz zum Markt. Einige Jahre später kehrten die Franziskaner zurück und restaurierten die Kirche. Der Innenraum hat ein einziges Schiff mit Seitenkapellen und eine Kuppel. Der Rundgang beginnt in der ersten Kapelle links.","es":"La iglesia fue fundada en 1560 por la noble napolitana Ilaria D'Apuzzo, que la donó a los frailes franciscanos, y fue consagrada en 1574. En el siglo XVII se amplió y se decoró en estilo barroco.\nEn 1808, durante el dominio francés, el convento se convirtió en cuartel y la plaza en mercado. Pocos años después los franciscanos regresaron y restauraron la iglesia. El interior tiene una sola nave con capillas laterales y una cúpula. El recorrido comienza en la primera capilla a la izquierda."},"foto":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAEkaADAAQAAAABAAAFAAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/8AAEQgFAASRAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMAAgICAgICBAICBAUEBAQFBwUFBQUHCQcHBwcHCQsJCQkJCQkLCwsLCwsLCw0NDQ0NDQ8PDw8PEREREREREREREf/bAEMBAwMDBAQEBwQEBxIMCgwSEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEv/dAAQASv/aAAwDAQACEQMRAD8A+Bv2ib8r43ktn/1exRXkker3OlwodFz5X/LQdjXvvxe8Can4o8YyzIwKBRxjniqng/4JXd3qB/tIGO3Rc7c9a5HJJ6nW4nlNlr/ifU42TTLZtp7qK9F02w8eQ6aZpojJuxtHda+sfDfgnRdNthBEigBcYA5rqW0a30zUEL7I4NhZi3QY9qXOifZngPhb4WeLteEV1qtz5KsAdp7V1d/8O4dOvFkjmXchG8+tcl4k+OFzc69J4c8KbEihO17g9Dj0qjL48jtist7eCc9Wx0zT50UoHuWr3+nad4f8+8YF1AWMA1yXgx5NdupL4qQoYRIPX1NeTRapqvjzUUs7YEW4PLkHA57V9beEtAtdH0tJCBGYxhM/xH+8R71MpLoUkaOoafY3M6QsMmHbsP8AOma1JHp0q20K/fIZsV18WmW+6Ep83Jd29TUV/YxX9yzR4IGOtStwOZs7gZG4VfnuIjxip5LYJ91apSIqgkitmriuUXRJDxSfYFdCT3pM7m+XipPtOxClLlFJ6HHXMRikZFHArGnALV0t5gk+9YE6Lv2+1UZ2sYdi95DrkL25+UfeFb2teL/E1tPJa2aJGixkq9dR4f0aOaxlvFUM6/nXDy+FdU8Tvd34YqgGI0Bx04rNvU1S0JvDuu+IdfuYm1wkIq9B0Jrso/E2i299/Z1xLGrngKx5p0Xh+40vw9DKqlZY0+cHqfpXgNx8P9S1LxXDrd4rCMPknJ6VV7k7 minciò a riscattarli con i propri beni. Secondo la tradizione, nel 1218 la Vergine gli chiese di fondare un ordine dedicato alla liberazione dei prigionieri: nacque così l'Ordine di Santa Maria della Mercede, cioè della misericordia.\nAi voti di povertà, castità e obbedienza i Mercedari ne aggiunsero un quarto: dare tutto per liberare chi era prigioniero e, se necessario, restare in catene al suo posto. Lo stemma dell'Ordine, che vedete in questa guida, unisce la croce bianca della Cattedrale di Barcellona ai pali rossi e oro della Corona d'Aragona.\nLa Madonna della Mercede si festeggia il 24 settembre, san Pietro Nolasco il 28 gennaio.","en":"Peter Nolasco, born in France to a noble family, was a merchant living in Barcelona. Moved by the fate of Christians captured in raids along the Mediterranean coasts and sold into slavery, he began to ransom them with his own wealth. According to tradition, in 1218 the Virgin asked him to found an order devoted to freeing captives: thus was born the Order of Our Lady of Mercy.\nTo the vows of poverty, chastity and obedience, the Mercedarians added a fourth: to give everything to free those held captive and, if necessary, to remain in chains in their place. The Order's coat of arms, which you see in this guide, joins the white cross of Barcelona Cathedral to the red and gold stripes of the Crown of Aragon.\nOur Lady of Mercy is celebrated on 24 September, Saint Peter Nolasco on 28 January.","fr":"Pierre Nolasque, né en France dans une famille noble, était un marchand établi à Barcelone. Touché par le sort des chrétiens capturés lors des razzias sur les côtes de la Méditerranée et réduits en esclavage, il commença à les racheter avec ses propres biens. Selon la tradition, en 1218 la Vierge lui demanda de fonder un ordre consacré à la libération des captifs : ainsi naquit l'Ordre de Notre-Dame de la Merci, c'est-à-dire de la miséricorde.\nAux vœux de pauvreté, de chasteté et d'obéissance, les Mercédaires en ajoutèrent un quatrième : tout donner pour libérer les captifs et, si nécessaire, rester enchaînés à leur place. Les armoiries de l'Ordre, que vous voyez dans ce guide, unissent la croix blanche de la cathédrale de Barcelone aux pals rouges et or de la Couronne d'Aragon.\nNotre-Dame de la Merci est fêtée le 24 septembre, saint Pierre Nolasque le 28 janvier.","de":"Petrus Nolascus, in Frankreich in einer adligen Familie geboren, war ein Kaufmann in Barcelona. Bewegt vom Schicksal der Christen, die bei Überfällen an den Küsten des Mittelmeers gefangen genommen und versklavt wurden, begann er, sie mit seinem eigenen Vermögen freizukaufen. Der Überlieferung nach bat ihn die Jungfrau Maria im Jahr 1218, einen Orden zur Befreiung der Gefangenen zu gründen: So entstand der Orden Unserer Lieben Frau von der Barmherzigkeit.\nZu den Gelübden der Armut, Keuschheit und des Gehorsams fügten die Mercedarier ein viertes hinzu: alles zu geben, um Gefangene zu befreien, und, wenn nötig, an ihrer Stelle in Ketten zu bleiben. Das Wappen des Ordens, das Sie in diesem Führer sehen, verbindet das weiße Kreuz der Kathedrale von Barcelona mit den rot-goldenen Streifen der Krone von Aragón.\nDas Fest Unserer Lieben Frau von der Barmherzigkeit wird am 24. September gefeiert, der heilige Petrus Nolascus am 28. Januar.","es":"Pedro Nolasco, nacido en Francia en una familia noble, era un mercader que vivía en Barcelona. Conmovido por la suerte de los cristianos capturados en las incursiones por las costas del Mediterráneo y reducidos a la esclavitud, comenzó a rescatarlos con sus propios bienes. Según la tradición, en 1218 la Virgen le pidió que fundara una orden dedicada a liberar a los cautivos: así nació la Orden de Nuestra Señora de la Merced, es decir, de la misericordia.\nA los votos de pobreza, castidad y obediencia, los Mercedarios añadieron un cuarto: darlo todo para liberar a los cautivos y, si fuera necesario, quedarse encadenados en su lugar. El escudo de la Orden, que veis en esta guía, une la cruz blanca de la catedral de Barcelona a las barras rojas y doradas de la Corona de Aragón.\nLa Virgen de la Merced se celebra el 24 de septiembre, y san Pedro Nolasco el 28 de enero."}},{"id":"mercedari-montecalvario","foto":"","credito":"","t":{"it":"I Mercedari a Montecalvario","en":"The Mercedarians at Montecalvario","fr":"Les Mercédaires à Montecalvario","de":"Die Mercedarier in Montecalvario","es":"Los Mercedarios en Montecalvario"},"m":{"it":"Dal 1923 al servizio dei Quartieri Spagnoli","en":"Serving the Spanish Quarters since 1923","fr":"Au service des Quartiers espagnols depuis 1923","de":"Seit 1923 im Dienst der Spanischen Viertel","es":"Al servicio de los Barrios Españoles desde 1923"},"d":{"it":"Dal 1923, come ricorda una lapide sotto il portico, la chiesa è affidata ai padri Mercedari. Oggi il loro impegno per la libertà vive in forme nuove: l'Ordine è presente nelle carceri, accanto ai giovani e a chi è vittima delle nuove schiavitù.\nQui, nel cuore dei Quartieri Spagnoli, la chiesa è un luogo di accoglienza e un punto di riferimento per le famiglie del quartiere. La comunità si prende cura anche del patrimonio artistico che state per scoprire, a partire dal restauro della Processione di San Gennaro nel polittico della prima cappella.","en":"Since 1923, as a plaque under the portico recalls, the church has been entrusted to the Mercedarian Fathers. Today their commitment to freedom lives on in new forms: the Order is present in prisons, alongside young people and the victims of modern slavery.\nHere, in the heart of the Spanish Quarters, the church is a place of welcome and a point of reference for local families. The community also cares for the artistic heritage you are about to discover, starting with the restoration of the Procession of Saint Januarius in the polyptych of the first chapel.","fr":"Depuis 1923, comme le rappelle une plaque sous le portique, l'église est confiée aux pères Mercédaires. Aujourd'hui, leur engagement pour la liberté se poursuit sous de nouvelles formes : l'Ordre est présent dans les prisons, auprès des jeunes et des victimes des nouvelles formes d'esclavage.\nIci, au cœur des Quartiers espagnols, l'église est un lieu d'accueil et un point de repère pour les familles du quartier. La communauté prend aussi soin du patrimoine artistique que vous allez découvrir, à commencer par la restauration de la Procession de saint Janvier dans le polyptyque de la première chapelle.","de":"Seit 1923, wie eine Gedenktafel unter dem Portikus erinnert, ist die Kirche den Mercedarierpatres anvertraut. Heute lebt ihr Einsatz für die Freiheit in neuen Formen weiter: Der Orden ist in Gefängnissen tätig, an der Seite junger Menschen und der Opfer moderner Sklaverei.\nHier, im Herzen der Spanischen Viertel, ist die Kirche ein Ort der Gastfreundschaft und ein Bezugspunkt für die Familien des Viertels. Die Gemeinschaft pflegt auch das künstlerische Erbe, das Sie gleich entdecken werden, angefangen mit der Restaurierung der Prozession des heiligen Januarius im Polyptychon der ersten Kapelle.","es":"Desde 1923, como recuerda una lápida bajo el pórtico, la iglesia está confiada a los padres Mercedarios. Hoy su compromiso con la libertad continúa de nuevas formas: la Orden está presente en las cárceles, junto a los jóvenes y a las víctimas de las nuevas esclavitudes.\nAquí, en el corazón de los Barrios Españoles, la iglesia es un lugar de acogida y un punto de referencia para las familias del barrio. La comunidad cuida también del patrimonio artístico que estás a punto de descubrir, empezando por la restauración de la Procesión de San Genaro en el políptico de la primera capilla."}},{"id":"polittico","t":{"it":"Polittico della Madonna del Rosario e Giudizio Universale","en":"Polyptych of Our Lady of the Rosary and the Last Judgement","fr":"Polyptyque de la Vierge du Rosaire et du Jugement dernier","de":"Polyptychon der Rosenkranzmadonna und des Jüngsten Gerichts","es":"Políptico de la Virgen del Rosario y el Juicio Final"},"m":{"it":"Prima cappella a sinistra, attribuito a Giovanni De Mio, XVI secolo","en":"First chapel on the left, attributed to Giovanni De Mio, 16th century","fr":"Première chapelle à gauche, attribué à Giovanni De Mio, XVIe siècle","de":"Erste Kapelle links, Giovanni De Mio zugeschrieben, 16. Jahrhundert","es":"Primera capilla a la izquierda, atribuido a Giovanni De Mio, siglo XVI"},"d":{"it":"È il tesoro più prezioso della chiesa. In alto, nella lunetta, Cristo giudice siede tra angeli e santi, mentre la Vergine intercede per le anime. Al centro la Madonna del Rosario con il Bambino consegna i rosari a clarisse e frati francescani, circondata dai quindici Misteri del Rosario. Più in basso predica san Bonaventura, e ai lati san Francesco e santa Chiara guidano le anime salvate fuori dal Purgatorio.\nNella predella, riscoperta nel 1980, è dipinta la processione di san Gennaro con il busto del santo: è la più antica immagine conosciuta di questa festa tanto cara ai napoletani. A lungo attribuita a Michele Curia, l'opera è oggi assegnata dagli studiosi al pittore veneto Giovanni De Mio.","en":"This is the church's most precious treasure. At the top, in the lunette, Christ the Judge sits among angels and saints while the Virgin intercedes for souls. In the centre, Our Lady of the Rosary with the Child hands rosaries to Poor Clare nuns and Franciscan friars, surrounded by the fifteen Mysteries of the Rosary. Below, Saint Bonaventure preaches, and at the sides Saint Francis and Saint Clare lead the saved souls out of Purgatory.\nThe predella, rediscovered in 1980, shows the procession of Saint Januarius with the saint's bust: it is the oldest known image of this feast, so dear to Neapolitans. Long attributed to Michele Curia, the work is now assigned by scholars to the Venetian painter Giovanni De Mio.","fr":"C'est le trésor le plus précieux de l'église. En haut, dans la lunette, le Christ juge siège parmi les anges et les saints, tandis que la Vierge intercède pour les âmes. Au centre, la Vierge du Rosaire avec l'Enfant remet des chapelets aux clarisses et aux franciscains, entourée des quinze Mystères du Rosaire. Plus bas, saint Bonaventure prêche, et sur les côtés saint François et sainte Claire conduisent les âmes sauvées hors du Purgatoire.\nLa prédelle, redécouverte en 1980, représente la procession de saint Janvier avec le buste du saint : c'est la plus ancienne image connue de cette fête si chère aux Napolitains. Longtemps attribuée à Michele Curia, l'œuvre est aujourd'hui donnée par les spécialistes au peintre vénitien Giovanni De Mio.","de":"Dies ist der kostbarste Schatz der Kirche. Oben in der Lünette thront Christus als Richter zwischen Engeln und Heiligen, während die Jungfrau für die Seelen bittet. In der Mitte überreicht die Rosenkranzmadonna mit dem Kind Klarissen und Franziskanern Rosenkränze, umgeben von den fünfzehn Rosenkranzgeheimnissen. Darunter predigt der heilige Bonaventura, und an den Seiten führen der heilige Franziskus und die heilige Klara die geretteten Seelen aus dem Fegefeuer.\nDie 1980 wiederentdeckte Predella zeigt die Prozession des heiligen Januarius mit der Büste des Heiligen: Es ist das älteste bekannte Bild dieses Festes, das den Neapolitanern so viel bedeutet. Lange Michele Curia zugeschrieben, gilt das Werk heute als Arbeit des venezianischen Malers Giovanni De Mio.","es":"Es el tesoro más valioso de la iglesia. Arriba, en el luneto, Cristo juez se sienta entre ángeles y santos mientras la Virgen intercede por las almas. En el centro, la Virgen del Rosario con el Niño entrega rosarios a clarisas y frailes franciscanos, rodeada por los quince Misterios del Rosario. Más abajo predica san Buenaventura, y a los lados san Francisco y santa Clara guían a las almas salvadas fuera del Purgatorio.\nLa predela, redescubierta en 1980, muestra la procesión de san Genaro con el busto del santo: es la imagen más antigua conocida de esta fiesta tan querida por los napolitanos. Atribuida durante mucho tiempo a Michele Curia, hoy los estudiosos la asignan al pintor véneto Giovanni De Mio."},"foto":"","credito":""},{"id":"deposizione","t":{"it":"Deposizione","en":"Deposition","fr":"Déposition","de":"Kreuzabnahme","es":"Descendimiento"},"m":{"it":"Seconda cappella a sinistra, scuola di Giovan Bernardo Lama","en":"Second chapel on the left, school of Giovan Bernardo Lama","fr":"Deuxième chapelle à gauche, école de Giovan Bernardo Lama","de":"Zweite Kapelle links, Schule des Giovan Bernardo Lama","es":"Segunda capilla a la izquierda, escuela de Giovan Bernardo Lama"},"d":{"it":"Questa cappella apparteneva alla famiglia Serracapriola, il cui stemma è inciso in una lapide sul pavimento. La tela della Deposizione, della scuola di Giovan Bernardo Lama, mostra il corpo di Cristo calato dalla croce e il dolore di chi lo circonda.\nAi lati si trovano due sepolcri: a sinistra quello di Nicola Maresca, presidente della Regia Camera della Sommaria nel Settecento, a destra quello dei Donnoroso Serracapriola.","en":"This chapel belonged to the Serracapriola family, whose coat of arms is carved on a slab in the floor. The painting of the Deposition, by the school of Giovan Bernardo Lama, shows the body of Christ taken down from the cross and the grief of those around him.\nAt the sides are two tombs: on the left that of Nicola Maresca, president of the Royal Treasury Court in the 18th century, and on the right that of the Donnoroso Serracapriola family.","fr":"Cette chapelle appartenait à la famille Serracapriola, dont les armoiries sont gravées sur une dalle du sol. La toile de la Déposition, de l'école de Giovan Bernardo Lama, montre le corps du Christ descendu de la croix et la douleur de ceux qui l'entourent.\nSur les côtés se trouvent deux tombeaux : à gauche celui de Nicola Maresca, président de la Chambre royale des comptes au XVIIIe siècle, à droite celui des Donnoroso Serracapriola.","de":"Diese Kapelle gehörte der Familie Serracapriola, deren Wappen in eine Grabplatte im Boden eingraviert ist. Das Gemälde der Kreuzabnahme aus der Schule des Giovan Bernardo Lama zeigt den vom Kreuz genommenen Leib Christi und den Schmerz der Umstehenden.\nAn den Seiten befinden sich zwei Grabmäler: links das von Nicola Maresca, im 18. Jahrhundert Präsident der königlichen Rechnungskammer, rechts das der Familie Donnoroso Serracapriola.","es":"Esta capilla pertenecía a la familia Serracapriola, cuyo escudo está grabado en una lápida del suelo. El lienzo del Descendimiento, de la escuela de Giovan Bernardo Lama, muestra el cuerpo de Cristo bajado de la cruz y el dolor de quienes lo rodean.\nA los lados hay dos sepulcros: a la izquierda el de Nicola Maresca, presidente de la Real Cámara de la Sumaria en el siglo XVIII, y a la derecha el de los Donnoroso Serracapriola."},"foto":"","credito":""},{"id":"sanciro","t":{"it":"San Ciro","en":"Saint Cyrus","fr":"Saint Cyr","de":"Heiliger Kyros","es":"San Ciro"},"m":{"it":"Terza cappella a sinistra, attribuito a Michelangelo Naccherino","en":"Third chapel on the left, attributed to Michelangelo Naccherino","fr":"Troisième chapelle à gauche, attribué à Michelangelo Naccherino","de":"Dritte Kapelle links, Michelangelo Naccherino zugeschrieben","es":"Tercera capilla a la izquierda, atribuido a Michelangelo Naccherino"},"d":{"it":"Sull'altare di questa cappella della famiglia Del Pozzo si trova la statua di san Ciro, medico e martire molto venerato a Napoli, attribuita allo scultore Michelangelo Naccherino.\nLe due tele settecentesche ai lati raffigurano santa Rosa tra le fiamme e i santi Rocco e Carlo che visitano gli appestati, un tema che ricorda le epidemie vissute dalla città.","en":"On the altar of this chapel of the Del Pozzo family stands the statue of Saint Cyrus, a physician and martyr much venerated in Naples, attributed to the sculptor Michelangelo Naccherino.\nThe two 18th-century paintings at the sides show Saint Rose amid the flames and Saints Roch and Charles visiting the plague-stricken, a subject that recalls the epidemics the city lived through.","fr":"Sur l'autel de cette chapelle de la famille Del Pozzo se dresse la statue de saint Cyr, médecin et martyr très vénéré à Naples, attribuée au sculpteur Michelangelo Naccherino.\nLes deux toiles du XVIIIe siècle sur les côtés représentent sainte Rose au milieu des flammes et les saints Roch et Charles visitant les pestiférés, un thème qui rappelle les épidémies vécues par la ville.","de":"Auf dem Altar dieser Kapelle der Familie Del Pozzo steht die Statue des heiligen Kyros, eines in Neapel sehr verehrten Arztes und Märtyrers, die dem Bildhauer Michelangelo Naccherino zugeschrieben wird.\nDie beiden Gemälde aus dem 18. Jahrhundert an den Seiten zeigen die heilige Rosa in den Flammen und die Heiligen Rochus und Karl bei den Pestkranken, ein Thema, das an die Epidemien der Stadt erinnert.","es":"Sobre el altar de esta capilla de la familia Del Pozzo se encuentra la estatua de san Ciro, médico y mártir muy venerado en Nápoles, atribuida al escultor Michelangelo Naccherino.\nLos dos lienzos del siglo XVIII a los lados representan a santa Rosa entre las llamas y a los santos Roque y Carlos visitando a los enfermos de peste, un tema que recuerda las epidemias que vivió la ciudad."},"foto":"","credito":""},{"id":"santantonio","t":{"it":"Sant'Antonio da Padova","en":"Saint Anthony of Padua","fr":"Saint Antoine de Padoue","de":"Heiliger Antonius von Padua","es":"San Antonio de Padua"},"m":{"it":"Quarta cappella a sinistra, Leonardo Castellano, 1567","en":"Fourth chapel on the left, Leonardo Castellano, 1567","fr":"Quatrième chapelle à gauche, Leonardo Castellano, 1567","de":"Vierte Kapelle links, Leonardo Castellano, 1567","es":"Cuarta capilla a la izquierda, Leonardo Castellano, 1567"},"d":{"it":"L'immagine di sant'Antonio da Padova sull'altare è opera di Leonardo Castellano e risale al 1567.\nLe due tele laterali, vicine allo stile di Giovan Battista Beinaschi, raccontano due celebri miracoli del santo: a sinistra Antonio predica ai pesci, che affiorano dall'acqua per ascoltarlo; a destra una mula si inginocchia davanti all'Eucaristia, segno della presenza di Cristo.","en":"The image of Saint Anthony of Padua on the altar is by Leonardo Castellano and dates from 1567.\nThe two side paintings, close to the style of Giovan Battista Beinaschi, tell two famous miracles of the saint: on the left Anthony preaches to the fish, which rise from the water to listen; on the right a mule kneels before the Eucharist, a sign of Christ's presence.","fr":"L'image de saint Antoine de Padoue sur l'autel est l'œuvre de Leonardo Castellano et date de 1567.\nLes deux toiles latérales, proches du style de Giovan Battista Beinaschi, racontent deux miracles célèbres du saint : à gauche, Antoine prêche aux poissons, qui sortent de l'eau pour l'écouter ; à droite, une mule s'agenouille devant l'Eucharistie, signe de la présence du Christ.","de":"Das Bild des heiligen Antonius von Padua auf dem Altar stammt von Leonardo Castellano aus dem Jahr 1567.\nDie beiden seitlichen Gemälde im Stil des Giovan Battista Beinaschi erzählen zwei berühmte Wunder des Heiligen: Links predigt Antonius den Fischen, die aus dem Wasser auftauchen, um ihm zuzuhören; rechts kniet ein Maultier vor der Eucharistie nieder, ein Zeichen der Gegenwart Christi.","es":"La imagen de san Antonio de Padua del altar es obra de Leonardo Castellano y data de 1567.\nLos dos lienzos laterales, cercanos al estilo de Giovan Battista Beinaschi, narran dos célebres milagros del santo: a la izquierda Antonio predica a los peces, que asoman del agua para escucharlo; a la derecha una mula se arrodilla ante la Eucaristía, signo de la presencia de Cristo."},"foto":"","credito":""},{"id":"animepurganti","t":{"it":"Madonna delle Anime Purganti","en":"Our Lady of the Souls in Purgatory","fr":"Vierge des âmes du Purgatoire","de":"Madonna der Armen Seelen","es":"Virgen de las Ánimas del Purgatorio"},"m":{"it":"Quinta cappella a sinistra, attribuita a Giovan Filippo Criscuolo, XVI secolo","en":"Fifth chapel on the left, attributed to Giovan Filippo Criscuolo, 16th century","fr":"Cinquième chapelle à gauche, attribuée à Giovan Filippo Criscuolo, XVIe siècle","de":"Fünfte Kapelle links, Giovan Filippo Criscuolo zugeschrieben, 16. Jahrhundert","es":"Quinta capilla a la izquierda, atribuida a Giovan Filippo Criscuolo, siglo XVI"},"d":{"it":"La tela sull'altare, del Cinquecento, raffigura la Madonna che soccorre le anime del Purgatorio ed è attribuita a Giovan Filippo Criscuolo; nell'Ottocento fu in parte ridipinta.\nAi lati, due dipinti mostrano san Francesco con le anime purganti e il miracolo delle rose fiorite in pieno inverno. Sui pilastri dell'altare in marmo, due bassorilievi del Seicento ritraggono i santi francescani Ludovico e Didaco.","en":"The 16th-century altarpiece shows the Virgin helping the souls in Purgatory and is attributed to Giovan Filippo Criscuolo; it was partly repainted in the 19th century.\nAt the sides, two paintings show Saint Francis with the souls in Purgatory and the miracle of the roses blooming in midwinter. On the pillars of the marble altar, two 17th-century reliefs portray the Franciscan saints Louis and Didacus.","fr":"La toile de l'autel, du XVIe siècle, représente la Vierge secourant les âmes du Purgatoire et est attribuée à Giovan Filippo Criscuolo ; elle fut en partie repeinte au XIXe siècle.\nSur les côtés, deux tableaux montrent saint François avec les âmes du Purgatoire et le miracle des roses fleuries en plein hiver. Sur les piliers de l'autel en marbre, deux bas-reliefs du XVIIe siècle représentent les saints franciscains Louis et Didace.","de":"Das Altarbild aus dem 16. Jahrhundert zeigt die Madonna, die den Seelen im Fegefeuer beisteht, und wird Giovan Filippo Criscuolo zugeschrieben; im 19. Jahrhundert wurde es teilweise übermalt.\nAn den Seiten zeigen zwei Gemälde den heiligen Franziskus mit den Armen Seelen und das Wunder der mitten im Winter blühenden Rosen. Auf den Pfeilern des Marmoraltars stellen zwei Reliefs aus dem 17. Jahrhundert die franziskanischen Heiligen Ludwig und Didakus dar.","es":"El lienzo del altar, del siglo XVI, representa a la Virgen socorriendo a las almas del Purgatorio y se atribuye a Giovan Filippo Criscuolo; en el siglo XIX fue repintado en parte.\nA los lados, dos pinturas muestran a san Francisco con las ánimas del Purgatorio y el milagro de las rosas florecidas en pleno invierno. En los pilares del altar de mármol, dos relieves del siglo XVII representan a los santos franciscanos Luis y Diego."},"foto":"","credito":""},{"id":"altare","t":{"it":"Altare maggiore","en":"High altar","fr":"Maître-autel","de":"Hochaltar","es":"Altar mayor"},"m":{"it":"Bottega di Cosimo Fanzago, 1677","en":"Workshop of Cosimo Fanzago, 1677","fr":"Atelier de Cosimo Fanzago, 1677","de":"Werkstatt des Cosimo Fanzago, 1677","es":"Taller de Cosimo Fanzago, 1677"},"d":{"it":"L'altare maggiore in marmi policromi e le due acquasantiere all'ingresso sono attribuiti alla bottega di Cosimo Fanzago, il grande maestro del barocco napoletano, e risalgono al rinnovamento della chiesa del 1677.\nL'aspetto attuale dell'interno, con gli stucchi e l'organo, si deve invece al restauro degli anni Trenta del Settecento, legato alla bottega di Domenico Antonio Vaccaro. L'abside fu ricostruita dopo i bombardamenti del 1943.","en":"The high altar in polychrome marble and the two holy-water stoups at the entrance are attributed to the workshop of Cosimo Fanzago, the great master of Neapolitan Baroque, and date from the renovation of 1677.\nThe present look of the interior, with its stucco work and organ, comes from the restoration of the 1730s, linked to the workshop of Domenico Antonio Vaccaro. The apse was rebuilt after the bombings of 1943.","fr":"Le maître-autel en marbres polychromes et les deux bénitiers de l'entrée sont attribués à l'atelier de Cosimo Fanzago, grand maître du baroque napolitain, et datent de la rénovation de 1677.\nL'aspect actuel de l'intérieur, avec les stucs et l'orgue, est dû à la restauration des années 1730, liée à l'atelier de Domenico Antonio Vaccaro. L'abside fut reconstruite après les bombardements de 1943.","de":"Der Hochaltar aus farbigem Marmor und die beiden Weihwasserbecken am Eingang werden der Werkstatt von Cosimo Fanzago zugeschrieben, dem großen Meister des neapolitanischen Barock, und stammen aus der Erneuerung von 1677.\nDas heutige Aussehen des Innenraums mit Stuck und Orgel geht auf die Restaurierung der 1730er-Jahre zurück, die mit der Werkstatt von Domenico Antonio Vaccaro verbunden ist. Die Apsis wurde nach den Bombenangriffen von 1943 wieder aufgebaut.","es":"El altar mayor de mármoles policromos y las dos pilas de agua bendita de la entrada se atribuyen al taller de Cosimo Fanzago, gran maestro del barroco napolitano, y datan de la renovación de 1677.\nEl aspecto actual del interior, con los estucos y el órgano, se debe a la restauración de la década de 1730, vinculada al taller de Domenico Antonio Vaccaro. El ábside fue reconstruido tras los bombardeos de 1943."},"foto":"","credito":""},{"id":"immacolata","t":{"it":"Immacolata","en":"Immaculate Conception","fr":"Immaculée Conception","de":"Unbefleckte Empfängnis","es":"Inmaculada"},"m":{"it":"Abside, statua lignea, fine XVII secolo","en":"Apse, wooden statue, late 17th century","fr":"Abside, statue en bois, fin du XVIIe siècle","de":"Apsis, Holzstatue, Ende des 17. Jahrhunderts","es":"Ábside, estatua de madera, finales del siglo XVII"},"d":{"it":"Questa statua lignea della fine del Seicento raffigura la Vergine Immacolata. In origine teneva in braccio Gesù Bambino, poi sostituito dall'angioletto che vedete oggi.\nI ganci sulle spalle fanno pensare che fosse portata in processione, probabilmente nella Processione del Battaglino: il Sabato Santo percorreva via Toledo tra San Ferdinando, San Giacomo degli Spagnoli e questa chiesa, finché fu soppressa a metà Settecento.","en":"This late 17th-century wooden statue depicts the Immaculate Virgin. She originally held the Child Jesus in her arms, later replaced by the little angel you see today.\nThe hooks on her shoulders suggest she was carried in procession, probably in the Battaglino Procession: on Holy Saturday it wound along Via Toledo between San Ferdinando, San Giacomo degli Spagnoli and this church, until it was abolished in the mid-18th century.","fr":"Cette statue en bois de la fin du XVIIe siècle représente la Vierge Immaculée. À l'origine, elle tenait l'Enfant Jésus dans ses bras, remplacé ensuite par le petit ange que vous voyez aujourd'hui.\nLes crochets sur ses épaules laissent penser qu'elle était portée en procession, probablement lors de la procession du Battaglino : le Samedi saint, elle parcourait la via Toledo entre San Ferdinando, San Giacomo degli Spagnoli et cette église, jusqu'à sa suppression au milieu du XVIIIe siècle.","de":"Diese Holzstatue vom Ende des 17. Jahrhunderts stellt die Unbefleckte Jungfrau dar. Ursprünglich hielt sie das Jesuskind im Arm, das später durch den kleinen Engel ersetzt wurde, den Sie heute sehen.\nDie Haken an den Schultern lassen vermuten, dass sie in Prozessionen getragen wurde, wahrscheinlich in der Battaglino-Prozession: Am Karsamstag zog sie die Via Toledo entlang zwischen San Ferdinando, San Giacomo degli Spagnoli und dieser Kirche, bis sie Mitte des 18. Jahrhunderts abgeschafft wurde.","es":"Esta estatua de madera de finales del siglo XVII representa a la Virgen Inmaculada. Originalmente sostenía en brazos al Niño Jesús, sustituido después por el angelito que hoy se ve.\nLos ganchos en los hombros sugieren que se llevaba en procesión, probablemente en la Procesión del Battaglino: el Sábado Santo recorría la Via Toledo entre San Ferdinando, San Giacomo degli Spagnoli y esta iglesia, hasta que fue suprimida a mediados del siglo XVIII."},"foto":"","credito":""},{"id":"trittico","t":{"it":"Trittico dell'Annunciata","en":"Triptych of the Annunciation","fr":"Triptyque de l'Annonciation","de":"Triptychon der Verkündigung","es":"Tríptico de la Anunciación"},"m":{"it":"Scuola di Andrea Sabatini, XVI secolo","en":"School of Andrea Sabatini, 16th century","fr":"École d'Andrea Sabatini, XVIe siècle","de":"Schule des Andrea Sabatini, 16. Jahrhundert","es":"Escuela de Andrea Sabatini, siglo XVI"},"d":{"it":"Il trittico, del Cinquecento, proviene dalla scuola di Andrea Sabatini da Salerno, il pittore che portò nel Sud Italia l'eleganza di Raffaello.\nAl centro la Madonna Annunciata accoglie l'annuncio dell'angelo. Ai lati sant'Andrea, apostolo e martire, e santa Veronica, che secondo la tradizione asciugò il volto di Gesù sulla via del Calvario.","en":"This 16th-century triptych comes from the school of Andrea Sabatini of Salerno, the painter who brought Raphael's elegance to southern Italy.\nIn the centre, the Virgin receives the angel's announcement. At the sides are Saint Andrew, apostle and martyr, and Saint Veronica, who according to tradition wiped the face of Jesus on the way to Calvary.","fr":"Ce triptyque du XVIe siècle provient de l'école d'Andrea Sabatini de Salerne, le peintre qui apporta l'élégance de Raphaël en Italie du Sud.\nAu centre, la Vierge accueille l'annonce de l'ange. Sur les côtés, saint André, apôtre et martyr, et sainte Véronique, qui selon la tradition essuya le visage de Jésus sur le chemin du Calvaire.","de":"Dieses Triptychon aus dem 16. Jahrhundert stammt aus der Schule des Andrea Sabatini aus Salerno, der die Eleganz Raffaels nach Süditalien brachte.\nIn der Mitte empfängt die Jungfrau die Botschaft des Engels. An den Seiten stehen der heilige Andreas, Apostel und Märtyrer, und die heilige Veronika, die der Überlieferung nach Jesus auf dem Weg nach Golgota das Gesicht abwischte.","es":"Este tríptico del siglo XVI procede de la escuela de Andrea Sabatini de Salerno, el pintor que llevó al sur de Italia la elegancia de Rafael.\nEn el centro, la Virgen recibe el anuncio del ángel. A los lados, san Andrés, apóstol y mártir, y santa Verónica, que según la tradición enjugó el rostro de Jesús camino del Calvario."},"foto":"","credito":""}],"version":16,"updated":"2026-10-13T21:24:50.540Z"}</script>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tx = (o, l) => (o && (o[l] || o.it)) || "";
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600); }

let lang = "";
try { lang = localStorage.getItem("lang") || ""; } catch(e){}
if (!LANGS[lang]) { const n=(navigator.language||"it").slice(0,2); lang = LANGS[n] ? n : "it"; }

/* ---------- voce ---------- */
let speakingId = null;
let speed = "normal";
try { if (localStorage.getItem("speed") === "slow") speed = "slow"; } catch(e){}
function stopSpeech(){ if ("speechSynthesis" in window) speechSynthesis.cancel(); speakingId = null; }
function speak(w){
  if (!("speechSynthesis" in window)) { toast(UI[lang].noVoice); return; }
  if (speakingId === w.id) { stopSpeech(); render(); return; }
  stopSpeech();
  const u = new SpeechSynthesisUtterance(tx(w.t,lang) + ". " + tx(w.d,lang).replace(/\n+/g," "));
  u.lang = LANGS[lang].voice;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(v=>v.lang===u.lang) || vs.find(v=>v.lang.slice(0,2)===lang);
  if (v) u.voice = v;
  u.rate = speed === "slow" ? 0.55 : 0.7;
  u.onend = u.onerror = () => { if (speakingId === w.id) { speakingId = null; render(); } };
  speakingId = w.id; speechSynthesis.speak(u); render();
}
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const STOP = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>';

/* ---------- vista turisti ---------- */
function header(){
  const c = cur().church;
  $("#churchName").textContent = c.name;
  $("#subtitle").textContent = ED.on ? "Modifica della guida" : (UI[lang].sub + (c.place ? ", " + c.place : ""));
  const l = $("#logo");
  if (c.logo) { l.className="logo has"; l.innerHTML='<img alt="Logo" src="'+c.logo+'">'; }
  else { l.className="logo"; l.textContent="Logo"; }
  document.title = c.name;
}
function renderLangs(){
  const n = $("#langs");
  if (ED.on) { n.innerHTML=""; n.style.display="none"; return; }
  n.style.display="";
  n.innerHTML = Object.entries(LANGS).map(([k,v]) => `<button lang="${k}" aria-pressed="${k===lang}" data-l="${k}">${v.label}</button>`).join("");
  n.onclick = e => { const b=e.target.closest("button"); if(!b) return; lang=b.dataset.l; try{localStorage.setItem("lang",lang)}catch(e){} stopSpeech(); render(); };
}
function render(){
  document.documentElement.lang = ED.on ? "it" : lang;
  header(); renderLangs();
  const vd = DATA.updated ? new Date(DATA.updated).toLocaleDateString(ED.on ? "it-IT" : lang) : "";
  const vl = DATA.version ? `<p class="ver">${ED.on ? "Versione pubblicata" : "v."} ${DATA.version}${vd ? ", " + vd : ""}</p>` : "";
  $("#foot").innerHTML = (ED.can && !ED.on ? '<button id="openEd">Modifica la guida</button>' : "") + vl;
  const ob = $("#openEd"); if (ob) ob.onclick = openEditor;
  if (ED.on) return renderEditor();
  const h = decodeURIComponent(location.hash.slice(1));
  const works = DATA.works;
  const i = works.findIndex(w => w.id === h);
  if (h === "sostieni") return renderGive();
  if (i < 0) return renderList();
  renderWork(i);
}
function renderList(){
  const u = UI[lang];
  $("#app").innerHTML = DATA.works.length ? `<ul class="list">${DATA.works.map(w =>
    `<li><a href="#${encodeURIComponent(w.id)}">${(w.foto||(w.galleria||[])[0])?`<img class="th" alt="" src="${w.foto||w.galleria[0]}">`:""}<div><strong>${esc(tx(w.t,lang))}</strong><span>${esc(tx(w.m,lang))}</span></div></a></li>`).join("")}</ul>`
    : `<p style="color:var(--muted);padding:32px 0">${u.empty}</p>`;
  const yc = cur().church.youtube;
  if (yc) $("#app").insertAdjacentHTML("beforeend", `<p class="ytc"><a class="vid" href="${esc(yc)}" target="_blank" rel="noopener">▶ ${u.ytc}</a></p>`);
  $("#app").insertAdjacentHTML("beforeend", giveBox(false));

}
function renderWork(i){
  const w = DATA.works[i], u = UI[lang], on = speakingId === w.id;

  $("#app").innerHTML = `
  <a class="back" href="#">← ${u.all}</a>
  <article class="work">
    <h2>${esc(tx(w.t,lang))}</h2>
    <p class="meta">${esc(tx(w.m,lang))}</p>
    ${w.foto ? `<figure><img alt="${esc(tx(w.t,lang))}" src="${w.foto}">${w.credito?`<figcaption>${u.photo}: ${esc(w.credito)}</figcaption>`:""}</figure>` : ""}

      <span class="halo">${on?STOP:PLAY}</span>

    ${tx(w.d,lang).split(/\n+/).filter(Boolean).map(p=>`<p class="text">${esc(p)}</p>`).join("")}
    ${(w.galleria||[]).length?`<div class="gal">${w.galleria.map((g,k)=>`<button class="gi" data-gi="${k}"><img src="${g}" alt="${esc(tx(w.t,lang))}, ${k+1}"></button>`).join("")}</div>`:""}
    ${(()=>{ const vs = videoLinks(w.video); return vs.length ? `<p class="vids">${vs.map((h,k)=>`<a class="vid" href="${esc(h)}" target="_blank" rel="noopener">▶ ${u.video}${vs.length>1?" "+(k+1):""}</a>`).join("")}</p>` : ""; })()}
    <div class="nav2">
      <span>${prev?`<a href="#${encodeURIComponent(prev.id)}">← ${esc(tx(prev.t,lang))}</a>`:""}</span>
      <span>${next?`<a href="#${encodeURIComponent(next.id)}">${esc(tx(next.t,lang))} →</a>`:""}</span>
    </div>
    <p class="givelink"><a href="#sostieni">♡ ${u.give}</a></p>
  </article>`;
  $("#listen").onclick = () => speak(w);
  const lb = src => { const o=document.createElement("div"); o.className="lb"; o.setAttribute("role","dialog"); o.innerHTML=`<img src="${src}" alt="">`; o.onclick=()=>o.remove(); document.body.appendChild(o); };
  document.querySelectorAll(".gi").forEach(b => b.onclick = () => lb(w.galleria[+b.dataset.gi]));
  const fimg = document.querySelector(".work figure img"); if (fimg) { fimg.style.cursor="zoom-in"; fimg.onclick = () => lb(w.foto); }
  document.querySelectorAll(".speed button").forEach(b => b.onclick = () => { speed = b.dataset.s; try { localStorage.setItem("speed", speed); } catch(e){} const was = speakingId === w.id; stopSpeech(); if (was) speak(w); else render(); });
}

function ytId(u){
  const m = String(u||"").match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : "";
}
function videoLinks(v){
  return String(v||"").split(/\s+/).filter(x => /^https?:\/\//i.test(x)).map(x => {
    const id = ytId(x); if (!id) return x;
    const t = (x.match(/[?&]t=(\d+)/) || [])[1];
    return "https://www.youtube.com/watch?v=" + id + (t ? "&t=" + t + "s" : "");
  });
}
function giveBox(full){
  const u = UI[lang], g = cur().church.donate || {};
  return `<section class="give${full?" full":""}">
    <h3>${u.gTitle}</h3>
    <p>${u.gText}</p>
    <p>${u.gBox}</p>
    ${g.url?`<p><a class="btn" href="${esc(g.url)}" target="_blank" rel="noopener">${u.gOnline}</a></p>`:""}
    ${g.iban?`<div class="bank"><b>${u.gBank}</b><br>IBAN: <span class="iban">${esc(g.iban)}</span> <button class="cp" data-iban="${esc(g.iban.replace(/\s+/g,""))}">${u.gCopy}</button>${g.holder?`<br>${u.gHolder}: ${esc(g.holder)}`:""}${g.reason?`<br>${u.gReason}: ${esc(g.reason)}`:""}</div>`:""}
    <p class="thanks">${u.gThanks}</p>
  </section>`;
}
function wireGive(){
  document.querySelectorAll(".give .cp").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.iban); toast(UI[lang].gCopied); } catch(e) { toast(b.dataset.iban); }
  });
}
function renderGive(){
  $("#app").innerHTML = `<a class="back" href="#">← ${UI[lang].all}</a>` + giveBox(true);
  wireGive();
}

/* ---------- editor ---------- */
function openEditor(){
  stopSpeech();
  let restored = null;
  try { const s = sessionStorage.getItem("guide-draft"); if (s && s !== JSON.stringify(DATA)) restored = JSON.parse(s); sessionStorage.removeItem("guide-draft"); } catch(e){}
  ED.draft = restored || JSON.parse(JSON.stringify(DATA));
  ED.dirty = !!restored; ED.on = true; ED.view = "home";
  render(); window.scrollTo(0,0);
  if (restored) toast("Ho ripristinato le modifiche non ancora pubblicate");
}
function closeEditor(){
  if (ED.dirty && !confirm("Ci sono modifiche non pubblicate. Uscire e scartarle?")) return;
  ED.on = false; ED.dirty = false; ED.draft = null; render(); window.scrollTo(0,0);
}
function touch(){ ED.dirty = true; const b=$("#pub"); if(b) b.disabled = ED.busy; const s=$("#st"); if(s) s.textContent = statusText(); }
function sizeKB(){ return Math.round(JSON.stringify(ED.draft).length/1024); }
function statusText(){ return "Versione " + (DATA.version || 1) + ", " + (ED.dirty ? "modifiche da pubblicare" : "tutto pubblicato") + ", " + (sizeKB()>1024 ? (sizeKB()/1024).toFixed(1)+" MB" : sizeKB()+" KB") + " su 15 MB"; }
function bar(){
  return `<div class="bar"><span class="st" id="st">${statusText()}</span>
    <button class="btn" id="pub" ${ED.dirty&&!ED.busy?"":"disabled"}>${ED.busy?"Pubblicazione…":"Pubblica"}</button>
    <button class="btn ghost" id="exit">Esci</button></div>`;
}
function wireBar(){ $("#pub").onclick = publish; $("#exit").onclick = closeEditor; }
function renderEditor(){
  if (ED.view === "work") return renderWorkEditor();

  $("#add").onclick = () => {
    const w = {id:"opera-"+Date.now().toString(36), t:{it:""}, m:{it:""}, d:{it:""}, foto:"", credito:""};

    ${L!=="it"?`<p class="hint">Stai modificando la versione in ${LANGS[L].name}. Il testo di riferimento è quello italiano.</p>`:""}
    <label for="ft">Titolo</label><input type="text" id="ft" value="${esc(w.t[L]||"")}">
    <label for="fm">Riga sotto il titolo (posizione, autore, epoca)</label><input type="text" id="fm" value="${esc(w.m[L]||"")}">
    <label for="fd">Descrizione, che verrà anche letta ad alta voce</label><textarea id="fd">${esc(w.d[L]||"")}</textarea>
    <p class="hint">Vai a capo con una riga vuota per creare un nuovo paragrafo.</p>
    ${ED.sample?`<div class="row2"><button class="btn ghost" id="tr">${ED.busy?"Traduzione in corso…":"Traduci dall'italiano nelle altre lingue"}</button></div>`:""}
    <h3>Foto principale</h3>
    ${w.foto?`<img class="pv" alt="" src="${w.foto}">`:""}
    <div class="row2"><input type="file" id="ff" accept="image/*">${w.foto?'<button class="btn danger" id="fx">Rimuovi foto</button>':""}</div>
    <label for="fc">Autore della foto (se non è vostra)</label><input type="text" id="fc" value="${esc(w.credito||"")}">
    <h3>Altre immagini</h3>
    <p class="hint">Dettagli, particolari, foto storiche… Puoi sceglierne più di una alla volta. Nella scheda compaiono sotto la descrizione e si ingrandiscono con un tocco.</p>
    ${(w.galleria||[]).length?`<div class="gal-ed">${w.galleria.map((g,k)=>`<div><img src="${g}" alt=""><button class="ico" data-gx="${k}" aria-label="Rimuovi immagine">✕</button></div>`).join("")}</div>`:""}
    <div class="row2"><input type="file" id="fg" accept="image/*" multiple></div>
    <h3>Video</h3>
    <label for="fv">Link ai video dal canale YouTube, uno per riga</label><textarea id="fv" style="min-height:90px" placeholder="https://youtu.be/…">${esc(w.video||"")}</textarea>
    <p class="hint" id="fvh"></p>
    <p class="hint">Su YouTube apri il video, tocca Condividi e poi Copia link. Vanno bene anche i video Shorts e i link con il minuto di partenza. Puoi caricare i video come "non in elenco", così li vede solo chi ha il link.</p>
    <h3>Elimina</h3>
    <div class="row2"><button class="btn danger" id="del">Elimina questa opera</button></div>
  </div>`;
  wireBar();
  $("#bk").onclick = () => { ED.view="home"; render(); window.scrollTo(0,0); };
  $("#app").querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ ED.elang=b.dataset.l; render(); });
  $("#ft").oninput = e => { w.t[L]=e.target.value; touch(); };
  $("#fm").oninput = e => { w.m[L]=e.target.value; touch(); };
  $("#fd").oninput = e => { w.d[L]=e.target.value; touch(); };
  $("#fc").oninput = e => { w.credito=e.target.value; touch(); };
  const fvh = () => { const raw = (w.video||"").split(/\s+/).filter(Boolean); const ok = raw.filter(x => ytId(x)).length; $("#fvh").textContent = raw.length ? (ok === raw.length ? `${ok} video YouTube riconosciut${ok===1?"o":"i"}` : `${ok} su ${raw.length} riconosciuti come YouTube: controlla gli altri link`) : ""; };
  fvh();
  $("#fv").oninput = e => { w.video=e.target.value.trim(); touch(); fvh(); };
  $("#ff").onchange = async e => { const f=e.target.files[0]; if(!f) return; toast("Preparo la foto…"); try{ w.foto = await shrink(f, 1280, "image/jpeg"); touch(); render(); }catch(x){ toast("Immagine non leggibile"); } };
  const fx=$("#fx"); if(fx) fx.onclick=()=>{ w.foto=""; touch(); render(); };
  $("#fg").onchange = async e => { const fs=[...e.target.files]; if(!fs.length) return; toast(fs.length>1?"Preparo le immagini…":"Preparo l'immagine…"); w.galleria = w.galleria || []; for (const f of fs) { try { w.galleria.push(await shrink(f, 1280, "image/jpeg")); } catch(x){} } touch(); render(); };
  $("#app").querySelectorAll("[data-gx]").forEach(b => b.onclick = () => { w.galleria.splice(+b.dataset.gx, 1); touch(); render(); });
  $("#del").onclick = () => { if(!confirm(`Eliminare "${w.t.it||"questa opera"}" dalla guida?`)) return; d.works = d.works.filter(x=>x!==w); touch(); ED.view="home"; render(); };
  const tr=$("#tr"); if(tr){ tr.disabled = ED.busy; tr.onclick = () => translate(w); }
}

async function translate(w){
  if (!w.t.it || !w.d.it) { toast("Scrivi prima titolo e descrizione in italiano"); return; }
  ED.busy = true; render();
  const prompt = "Sei un traduttore esperto di storia dell'arte e liturgia cattolica. Traduci dall'italiano in inglese (en), francese (fr), tedesco (de) e spagnolo (es) questa scheda di un'audioguida per turisti in una chiesa di Napoli. Usa la terminologia religiosa e storico-artistica corretta in ogni lingua, non tradurre i nomi degli artisti, conserva i paragrafi separati da \\n e uno stile chiaro adatto all'ascolto. Rispondi solo con JSON nella forma {\"en\":{\"t\":\"\",\"m\":\"\",\"d\":\"\"},\"fr\":{...},\"de\":{...},\"es\":{...}} dove t è il titolo, m la riga sotto il titolo, d la descrizione.\n\nScheda:\n" + JSON.stringify({t:w.t.it, m:w.m.it||"", d:w.d.it});
  try {
    const r = await ED.sample.json(prompt, {modelTier:"default"});
    for (const l of ["en","fr","de","es"]) if (r && r[l]) { w.t[l]=r[l].t||""; w.m[l]=r[l].m||""; w.d[l]=r[l].d||""; }
    touch(); toast("Traduzioni pronte, controllale prima di pubblicare");
  } catch(e) {
    if (e && e.code === "not_granted") { ED.sample = null; toast("La traduzione automatica non è disponibile"); }
    else if (e && e.code === "rate_limited") toast("Troppe richieste, riprova tra qualche minuto");
    else toast("Traduzione non riuscita, riprova");
  }
  ED.busy = false; render();
}

function shrink(file, max, type){
  return new Promise((res, rej) => {
    const img = new Image();
    const isStr = typeof file === "string";
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const x = c.getContext("2d");
      if (type !== "image/png") { x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); }
      x.drawImage(img, 0, 0, c.width, c.height);
      if (!isStr) URL.revokeObjectURL(img.src);
      if (type === "image/png") return res(c.toDataURL("image/png"));
      const j = c.toDataURL("image/jpeg", 0.72);
      let wp = ""; try { wp = c.toDataURL("image/webp", 0.72); } catch(e){}
      res(wp.startsWith("data:image/webp") && wp.length < j.length ? wp : j);
    };
    img.onerror = rej;
    img.src = isStr ? file : URL.createObjectURL(file);
  });
}

function renderQR(){
  const d = ED.draft, base = (d.church.publicUrl||"").split("#")[0];
  $("#app").innerHTML = `<div class="ed">${bar()}
    <button class="back noprint" id="bk">← Torna alla modifica</button>
    <div class="row2 noprint"><button class="btn" id="pr">Stampa</button></div>
    ${base?"":'<p class="hint">Inserisci prima il link pubblico della guida.</p>'}
    <div class="qrgrid">${d.works.map(w=>`<div class="qrcard">${d.church.logo?`<img src="${d.church.logo}" alt="" style="height:44px;display:block;margin:0 auto 4px">`:""}<small>${esc(d.church.name)}</small><div class="q" id="q-${esc(w.id)}"></div><strong>${esc(w.t.it)}</strong><small>${esc(w.t.en||"")}</small><br><small>${UI.it.scan} / ${UI.en.scan}</small></div>`).join("")}</div>
  </div>`;
  wireBar();
  $("#bk").onclick = () => { ED.view="home"; render(); };
  $("#pr").onclick = () => window.print();
  if (base && typeof QRCode !== "undefined") d.works.forEach(w => new QRCode(document.getElementById("q-"+w.id), {text: base + "#" + encodeURIComponent(w.id), width:160, height:160, correctLevel: QRCode.CorrectLevel.M}));
}

async function publish(){
  if (!ED.dirty || ED.busy) return;
  const css = document.getElementById("css").textContent;
  const main = document.getElementById("main").textContent;
  ED.draft.version = (DATA.version || 0) + 1;
  ED.draft.updated = new Date().toISOString();
  const html = buildPage(ED.draft, css, main);
  if (html.length > 15.5*1024*1024) { toast("La guida supera i 15 MB: togli o riduci qualche foto"); return; }
  ED.busy = true; render();
  try { sessionStorage.setItem("guide-draft", JSON.stringify(ED.draft)); } catch(e){}
  try {
    await ED.artifact.publish(html);
    ED.dirty = false;
    try { sessionStorage.removeItem("guide-draft"); } catch(e){}
    toast("Guida pubblicata");
  } catch(e) {
    const c = e && e.code;
    if (c === "conflict") { toast("Qualcun altro ha pubblicato nel frattempo: ricarico la versione più recente"); }
    else if (["not_writer","not_granted","not_declared","consent_required","capability_disabled","capability_removed"].includes(c)) { ED.can=false; ED.on=false; toast("Il tuo profilo può solo consultare la guida"); }
    else if (c === "too_large") toast("La guida è troppo pesante: togli o riduci qualche foto");
    else if (c === "rate_limited") toast("Hai pubblicato molte volte di seguito, attendi un minuto");
    else toast("Pubblicazione non riuscita, riprova tra poco");
  }
  ED.busy = false; render();
}

window.addEventListener("beforeunload", e => { if (ED.on && ED.dirty) { try{ sessionStorage.setItem("guide-draft", JSON.stringify(ED.draft)); }catch(x){} } });
window.addEventListener("hashchange", () => { if (ED.on) return; stopSpeech(); render(); window.scrollTo(0,0); });
render();

(async () => {
  if (!window.claude || !window.claude.use) return;
  try {
    const user = await window.claude.use("user");
    if (!user || !(await user.canEdit())) return;
    const art = await window.claude.use("artifact");
    if (!art) return;
    ED.artifact = art; ED.can = true;
    ED.sample = await window.claude.use("sample");
    let pending = false; try { pending = !!sessionStorage.getItem("guide-draft"); } catch(e){}
    if (pending) openEditor(); else render();
  } catch(e) {}
})();
</script>
